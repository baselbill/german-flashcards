<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Karteikarten — German Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper:       #f6f1e7;
  --paper-light: #fbf7ee;
  --paper-dark:  #ebe4d3;
  --ink:         #1a1610;
  --ink-soft:    #4a4338;
  --ink-faint:   #8a8174;
  --rule:        #c9bfa8;
  --rule-soft:   #ddd4be;
  --accent:      #6b1d1d;
  --accent-soft: #8c3a3a;
  --accent-hint: #ede0db;
  --green:       #3d5a3a;
  --green-light: #dce8db;
  --gold:        #8a6e2f;
  --gold-light:  #f0e8d0;
  --blue:        #2c4a8c;
  --serif-display: 'EB Garamond', 'Iowan Old Style', Georgia, serif;
  --serif-body:    'Crimson Pro', 'Iowan Old Style', Georgia, serif;
  --mono:          'JetBrains Mono', 'Courier New', monospace;
  --shadow-paper: 0 1px 0 rgba(255,255,255,.6) inset, 0 8px 24px -12px rgba(60,40,20,.18), 0 2px 4px -2px rgba(60,40,20,.10);
  --shadow-card:  0 1px 0 rgba(255,255,255,.7) inset, 0 14px 40px -16px rgba(60,40,20,.30), 0 4px 8px -4px rgba(60,40,20,.14);
  --rating-bar-h: 96px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif-body);
  font-size: 19px;
  line-height: 1.55;
  min-height: 100%;
  font-feature-settings: "kern","liga","onum";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background-image:
    radial-gradient(at 20% 0%,  rgba(220,200,160,.18) 0%, transparent 40%),
    radial-gradient(at 80% 100%,rgba(180,160,120,.12) 0%, transparent 50%),
    repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(60,40,20,.012) 2px, rgba(60,40,20,.012) 3px);
  background-attachment: fixed;
}
::selection { background: var(--accent-hint); color: var(--ink); }
button { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; font-size: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1,h2,h3 { font-family: var(--serif-display); font-weight: 500; letter-spacing:.005em; line-height:1.2; }
h2 { font-size: 30px; margin-bottom: 6px; }
h3 { font-size: 22px; margin-bottom: 4px; }

/* MASTHEAD */
.masthead {
  border-bottom: 1px double var(--rule);
  padding: 24px 40px 18px;
  display: flex; justify-content: space-between; align-items: flex-end;
  background: linear-gradient(180deg, rgba(255,255,255,.4), transparent);
  flex-wrap: wrap; gap: 14px;
}
.masthead-title { font-family: var(--serif-display); font-weight:500; font-size:36px; letter-spacing:.01em; line-height:1; }
.masthead-title em { color: var(--accent); font-style:italic; font-weight:500; }
.masthead-sub { font-family: var(--serif-display); font-style:italic; color: var(--ink-soft); font-size:15px; margin-top:5px; letter-spacing:.02em; }
.masthead-meta { display:flex; gap:24px; align-items:baseline; }
.meta-item { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-soft); display:flex; flex-direction:column; gap:4px; text-align:center; }
.meta-value { font-family:var(--serif-display); font-size:22px; font-weight:500; color:var(--ink); letter-spacing:0; text-transform:none; }
.meta-value.due    { color: var(--accent); }
.meta-value.streak { color: var(--gold); }

/* MAIN */
main { max-width: 1080px; margin: 0 auto; padding: 32px 40px 80px; }
.section-rule { display:flex; align-items:center; gap:14px; margin:12px 0 22px; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.18em; color:var(--ink-faint); }
.section-rule::before,.section-rule::after { content:""; flex:1; height:1px; background:var(--rule); }
.lede { font-family:var(--serif-display); font-style:italic; color:var(--ink-soft); font-size:19px; max-width:60ch; }

/* DASHBOARD */
/* PROGRESS STRIP */
.progress-strip { display:flex; align-items:center; gap:20px; padding:14px 0 18px; border-bottom:1px solid var(--rule-soft); margin-bottom:24px; flex-wrap:wrap; }
.ring-mini { position:relative; width:52px; height:52px; flex-shrink:0; }
.ring-svg   { display:block; }
.ring-track { fill:none; stroke:var(--rule-soft); stroke-width:5; }
.ring-fill  { fill:none; stroke:var(--gold); stroke-width:5; stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%; transition:stroke-dashoffset 500ms cubic-bezier(.4,0,.2,1); }
.ring-fill.complete { stroke:var(--green); }
.ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
.ring-count  { font-family:var(--serif-display); font-size:14px; font-weight:500; line-height:1; color:var(--ink); }
.ring-slash  { font-family:var(--mono); font-size:8px; color:var(--ink-faint); line-height:1; }
.heatmap-wrap   { display:flex; flex-direction:column; gap:6px; flex:1; min-width:0; }
.heatmap-meta   { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.heatmap-motive { font-family:var(--serif-display); font-style:italic; font-size:14px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.heatmap-motive strong { font-style:normal; color:var(--ink); font-weight:500; }
.heatmap-streak-pip { font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--gold); white-space:nowrap; }
.heatmap-grid { display:flex; flex-wrap:nowrap; gap:3px; overflow:hidden; }
.heat-cell { width:13px; height:13px; border:1px solid var(--rule-soft); background:var(--paper); position:relative; flex-shrink:0; transition:background 300ms ease; }
.heat-cell[data-level="1"] { background:var(--gold-light); border-color:var(--gold); }
.heat-cell[data-level="2"] { background:#e8d28c; border-color:var(--gold); }
.heat-cell[data-level="3"] { background:var(--gold); border-color:var(--gold); }
.heat-cell[data-level="4"] { background:var(--green); border-color:#2d4a2b; }
.heat-cell.today { outline:2px solid var(--accent); outline-offset:1px; }
.heat-cell[title]:hover::after { content:attr(title); position:absolute; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper-light); font-family:var(--mono); font-size:10px; padding:3px 7px; white-space:nowrap; pointer-events:none; z-index:10; }

/* MODULE GRID */
.modules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:22px; margin:28px 0; }
.module-card { background:var(--paper-light); border:1px solid var(--rule); padding:22px 22px 20px; position:relative; cursor:pointer; transition:transform 180ms ease,box-shadow 180ms ease,border-color 180ms ease; text-align:left; display:flex; flex-direction:column; min-height:190px; }
.module-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-paper); border-color:var(--accent-soft); }
.module-card.active-mod { border:1.5px solid var(--accent); box-shadow:var(--shadow-paper); }
.module-card.active-mod::before { content:"recent"; position:absolute; top:12px; right:14px; font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.14em; color:var(--accent); }
.module-num   { font-family:var(--serif-display); font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:.18em; color:var(--ink-faint); margin-bottom:8px; display:block; }
.module-roman { font-family:var(--serif-display); font-size:13px; letter-spacing:.15em; }
.module-title { font-family:var(--serif-display); font-size:22px; font-weight:500; line-height:1.15; margin-bottom:4px; }
.module-desc  { font-style:italic; color:var(--ink-soft); font-size:15px; line-height:1.4; margin-bottom:14px; flex:1; }
.module-stats { display:flex; justify-content:space-between; align-items:baseline; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); border-top:1px solid var(--rule-soft); padding-top:12px; margin-top:auto; }
.module-progress-bar  { height:3px; background:var(--rule-soft); margin-top:8px; position:relative; overflow:hidden; }
.module-progress-fill { position:absolute; inset:0 auto 0 0; background:var(--accent); width:0; transition:width 400ms ease; }

/* STUDY VIEW */
body.in-study { padding-bottom: var(--rating-bar-h); }
.study-bar { display:flex; justify-content:space-between; align-items:center; padding:8px 0 16px; border-bottom:1px solid var(--rule-soft); margin-bottom:28px; }
.study-back { font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
.study-back:hover { color:var(--accent); }
.study-progress { font-family:var(--mono); font-size:12px; letter-spacing:.1em; color:var(--ink-soft); }

.flashcard-stage { perspective:2000px; margin:0 auto; max-width:680px; min-height:calc(100svh - 200px - var(--rating-bar-h)); position:relative; }
.flashcard { position:relative; width:100%; min-height:calc(100svh - 200px - var(--rating-bar-h)); transition:transform 440ms cubic-bezier(.5,.05,.2,1); transform-style:preserve-3d; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.flashcard.flipped { transform:rotateY(180deg); }

.card-face { position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden; background:var(--paper-light); border:1px solid var(--rule); box-shadow:var(--shadow-card); padding:52px 48px 44px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; overflow:hidden; }
.card-face::before { content:""; position:absolute; inset:8px; border:1px solid var(--rule-soft); pointer-events:none; }
.card-face.back { transform:rotateY(180deg); justify-content:flex-start; padding-top:40px; overflow-y:auto; }

.card-corner    { position:absolute; top:18px; font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.18em; color:var(--ink-faint); }
.card-corner.tl { left:24px; }
.card-corner.tr { right:24px; }
.card-type-label { font-family:var(--serif-display); font-style:italic; font-size:14px; color:var(--ink-faint); letter-spacing:.05em; margin-bottom:22px; }
.card-term { font-family:var(--serif-display); font-size:52px; font-weight:500; line-height:1.1; color:var(--ink); margin-bottom:12px; letter-spacing:-.01em; word-break:break-word; }
.card-term .article { color:var(--ink-faint); font-style:italic; font-weight:400; font-size:.65em; margin-right:.15em; vertical-align:.05em; }
.card-flip-hint { position:absolute; bottom:24px; font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.18em; color:var(--ink-faint); }

.back-stack      { width:100%; display:flex; flex-direction:column; align-items:center; }
.back-english    { font-family:var(--serif-display); font-size:36px; font-weight:500; color:var(--ink); margin-bottom:4px; margin-top:16px; }
.back-term-small { font-family:var(--serif-display); font-style:italic; color:var(--accent); font-size:17px; margin-bottom:20px; }
.back-divider    { width:80px; height:1px; background:var(--rule); margin:0 auto 18px; position:relative; }
.back-divider::after { content:"✦"; position:absolute; top:-10px; left:50%; transform:translateX(-50%); background:var(--paper-light); padding:0 8px; color:var(--ink-faint); font-size:11px; }
.back-example    { font-family:var(--serif-body); font-size:20px; line-height:1.4; color:var(--ink); font-style:italic; max-width:90%; margin-bottom:7px; }
.back-example-en { font-family:var(--serif-body); font-size:16px; line-height:1.4; color:var(--ink-soft); max-width:90%; margin-bottom:20px; }

.grammar-block { background:var(--paper); border:1px solid var(--rule-soft); padding:12px 16px; margin-top:6px; width:100%; max-width:480px; font-size:15px; }
.grammar-label { font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:.18em; color:var(--ink-faint); margin-bottom:8px; }
.grammar-noun  { display:flex; justify-content:space-between; font-family:var(--serif-body); gap:16px; margin-top:3px; }
.grammar-noun .label { color:var(--ink-faint); font-style:italic; font-size:14px; }
.grammar-verb  { display:grid; grid-template-columns:max-content 1fr; column-gap:16px; row-gap:4px; font-family:var(--serif-body); }
.grammar-verb .label { color:var(--ink-faint); font-style:italic; font-size:13px; letter-spacing:.02em; }
.grammar-verb .val   { font-size:15px; }

/* RATING BAR — fixed at bottom */
.rating-bar {
  position: fixed; bottom:0; left:0; right:0; z-index:40;
  display: none;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--rule);
  background: var(--paper);
  height: var(--rating-bar-h);
  box-shadow: 0 -4px 24px -8px rgba(60,40,20,.14);
}
.rating-bar.visible { display: grid; }

.rating-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  padding: 8px 6px;
  border-right: 1px solid var(--rule-soft);
  border-top: 4px solid transparent;
  transition: background 100ms ease;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
.rating-btn:last-child { border-right: none; }
.rating-btn:not(:disabled):active { background: var(--paper-dark); transform: scale(0.96); transition: transform 60ms ease; }
.rating-btn:not(:disabled):hover  { background: var(--paper-dark); }
.rating-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.rating-btn.again { border-top-color: var(--accent); }
.rating-btn.hard  { border-top-color: var(--gold);   }
.rating-btn.good  { border-top-color: var(--green);  }
.rating-btn.easy  { border-top-color: var(--blue);   }
.rating-label    { font-family:var(--serif-display); font-size:18px; font-weight:500; line-height:1; }
.rating-shortcut { font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-faint); }
.rating-interval { font-family:var(--mono); font-size:9px; color:var(--ink-faint); }

/* DONE STATE */
.empty-state { text-align:center; padding:60px 20px; max-width:540px; margin:0 auto; }
.empty-state h2 { font-style:italic; margin-bottom:16px; }
.empty-state p  { color:var(--ink-soft); font-size:17px; margin-bottom:18px; }
.empty-ornament { font-family:var(--serif-display); font-size:28px; color:var(--ink-faint); margin-bottom:16px; }
.session-summary { background:var(--paper-light); border:1px solid var(--rule); padding:20px 24px; max-width:380px; margin:0 auto 24px; text-align:left; }
.summary-row     { display:flex; justify-content:space-between; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--rule-soft); font-family:var(--serif-body); }
.summary-row:last-child { border-bottom:none; }
.summary-label   { color:var(--ink-soft); font-style:italic; font-size:16px; }
.summary-val     { font-family:var(--mono); font-size:13px; font-weight:500; }
.summary-val.good  { color: var(--green); }
.summary-val.again { color: var(--accent); }
.celebration { font-family:var(--serif-display); font-style:italic; font-size:18px; color:var(--ink-soft); margin-bottom:22px; max-width:380px; margin-left:auto; margin-right:auto; }
.celebration strong { font-style:normal; color:var(--ink); }

/* UTILITY */
.btn { display:inline-block; font-family:var(--serif-display); font-size:16px; letter-spacing:.04em; background:var(--ink); color:var(--paper-light); border:1px solid var(--ink); padding:12px 28px; transition:background 120ms ease,color 120ms ease; cursor:pointer; }
.btn:hover { background:var(--accent); border-color:var(--accent); }
.btn.secondary { background:transparent; color:var(--ink); border:1px solid var(--ink-soft); }
.btn.secondary:hover { background:var(--ink); color:var(--paper-light); }
.btn.danger { background:transparent; color:var(--accent); border-color:var(--accent); }
.btn.danger:hover { background:var(--accent); color:var(--paper-light); }
.settings-bar { display:flex; justify-content:space-between; align-items:center; margin-top:32px; padding-top:18px; border-top:1px solid var(--rule-soft); }
.tiny-link { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-faint); padding:4px 8px; margin:0 -8px; }
.tiny-link:hover { color:var(--accent); }

.modal-backdrop { position:fixed; inset:0; background:rgba(20,14,8,.4); backdrop-filter:blur(2px); display:none; z-index:50; justify-content:center; align-items:center; }
.modal-backdrop.open { display:flex; }
.modal { background:var(--paper-light); border:1px solid var(--rule); padding:32px 36px; width:min(440px,90vw); box-shadow:var(--shadow-card); position:relative; }
.modal h3 { margin-bottom:18px; }
.modal-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--rule-soft); }
.modal-row:last-child { border-bottom:none; }
.modal-row label { font-family:var(--serif-body); font-size:17px; }
.modal-row input[type=number],.modal-row select { font-family:var(--mono); font-size:15px; border:1px solid var(--rule); background:var(--paper); padding:6px 10px; color:var(--ink); }
.modal-row input[type=number] { width:80px; text-align:center; }
.modal-actions { display:flex; gap:12px; justify-content:flex-end; margin-top:24px; flex-wrap:wrap; }
.modal-close { position:absolute; top:14px; right:14px; font-size:22px; color:var(--ink-faint); padding:4px 8px; }
.modal-close:hover { color:var(--accent); }

.toast { position:fixed; bottom:calc(var(--rating-bar-h) + 12px); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper-light); font-family:var(--serif-display); font-style:italic; font-size:15px; padding:12px 22px; z-index:100; opacity:0; transition:opacity 240ms ease; pointer-events:none; white-space:nowrap; }
.toast.show { opacity:1; }

/* RESPONSIVE */
@media (max-width: 720px) {
  :root { --rating-bar-h: 80px; }
  .masthead { padding:18px 18px 14px; }
  .masthead-meta { gap:16px; }
  .masthead-title { font-size:28px; }
  main { padding:20px 18px 80px; }
  .progress-strip { gap:14px; padding:10px 0 14px; }
  .flashcard-stage, .flashcard { min-height:calc(100svh - 170px - var(--rating-bar-h)); }
  .card-face { padding:40px 18px 32px; }
  .card-term { font-size:38px; }
  .back-english  { font-size:28px; }
  .back-example  { font-size:17px; }
  .modules-grid  { grid-template-columns:1fr; gap:14px; }
  .rating-label  { font-size:16px; }
}
@media (max-width: 480px) {
  .heatmap-grid { gap:3px; }
  .heat-cell { width:14px; height:14px; }
  .rating-shortcut { display:none; }
}

/* ---- TIER BAR ---- */
.tier-bar { padding:10px 0 14px; border-bottom:1px solid var(--rule-soft); margin-bottom:20px; }
.tier-label { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-soft); margin-bottom:6px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
.tier-name { color:var(--gold); font-weight:500; }
.tier-xp-meta { color:var(--ink-faint); }
.tier-progress-track { height:4px; background:var(--rule-soft); position:relative; overflow:hidden; }
.tier-progress-fill { position:absolute; inset:0 auto 0 0; background:var(--gold); transition:width 600ms cubic-bezier(.4,0,.2,1); }

/* ---- BADGE GRID ---- */
.badge-section { margin-top:20px; }
.badges-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:10px; margin:14px 0 28px; }
.badge-item { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; border:1px solid var(--rule-soft); background:var(--paper-light); text-align:center; }
.badge-item.unlocked { border-color:var(--gold); background:var(--gold-light); }
.badge-item.locked { opacity:.45; filter:grayscale(1); }
.badge-emoji { font-size:22px; line-height:1; }
.badge-label { font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); line-height:1.3; }
.badge-item.unlocked .badge-label { color:var(--gold); }

/* ---- BADGE UNLOCK NOTIFICATION (done screen) ---- */
.badge-unlock-notif { margin:18px 0 0; padding:14px 18px; border:1px solid var(--gold); background:var(--gold-light); text-align:left; }
.badge-unlock-title { font-family:var(--serif-display); font-size:14px; color:var(--gold); margin-bottom:10px; }
.badge-unlock-row { display:flex; align-items:center; gap:10px; padding:4px 0; }
.badge-unlock-info { display:flex; flex-direction:column; gap:2px; }
.badge-desc { font-family:var(--serif-body); font-style:italic; font-size:13px; color:var(--ink-soft); }

@media (max-width:720px) {
  .badges-grid { grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); gap:7px; }
  .badge-emoji { font-size:18px; }
}
</style>
</head>
<body>

<header class="masthead">
  <div>
    <h1 class="masthead-title">Karteikarten <em>Deutsch</em></h1>
    <div class="masthead-sub">A spaced-repetition reader for the German language</div>
  </div>
  <div class="masthead-meta">
    <div class="meta-item"><span>Due today</span><span class="meta-value due" id="metaDue">—</span></div>

<script>
"use strict";

const CARDS = JSON.parse(document.getElementById("cards-data").textContent);

const MODULE_META = [
  { num:1, roman:"I",    title:"Survival kit",    blurb:"Greetings, courtesy, articles, pronouns, the top thirty words." },
  { num:2, roman:"II",   title:"Daily basics",     blurb:"Numbers, time, calendar, family, food, drink. Ordering at a café." },
  { num:3, roman:"III",  title:"Home & routine",   blurb:"Rooms, weather, the body, clothes, colors. Daily routine verbs." },
  { num:4, roman:"IV",   title:"City & travel",    blurb:"Streets, transport, directions, tickets. Getting around with a passport." },
  { num:5, roman:"V",    title:"Work & study",     blurb:"Professions, the office, school, money, contracts." },
  { num:6, roman:"VI",   title:"Health & feeling", blurb:"Symptoms, emotions, sport, hobbies. The pulse of a person." },
  { num:7, roman:"VII",  title:"Nature & world",   blurb:"Animals, plants, geography, materials, environment." },
  { num:8, roman:"VIII", title:"Society",           blurb:"Politics, media, abstract concepts, conjunctions, opinion-making." },
  { num:9, roman:"IX",   title:"Refinement",        blurb:"Idioms, formal verbs, nuanced adjectives. Polishing the edges." },
];

const STORAGE_KEY = "germanFlashcards.srs.v1";
const CONFIG_KEY  = "germanFlashcards.config.v1";
const STATS_KEY   = "germanFlashcards.stats.v1";

/* ---- TIERS ---- */
const TIERS = [
  {num:1, name:"Anfänger",          threshold:0},
  {num:2, name:"Lernender",         threshold:500},
  {num:3, name:"Fortgeschrittener", threshold:2000},
  {num:4, name:"Geübter",           threshold:5000},
  {num:5, name:"Kenner",            threshold:10000},
  {num:6, name:"Kundiger",          threshold:20000},
  {num:7, name:"Meister",           threshold:40000},
];
function getTier(xp) {
  let tier = TIERS[0];
  for (const t of TIERS) { if (xp >= t.threshold) tier = t; }
  const next = TIERS.find(t => t.threshold > xp) || null;
  return { ...tier, next };
}
function goalStreak() {
  let streak = 0;
  const d = new Date();
  while (true) {
    const iso = d.toISOString().slice(0, 10);
    if ((STATS.perDay[iso] || 0) >= CONFIG.dailyGoal) { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  return streak;
}
function _modComplete(m) {
  return moduleCards(m).every(c => !!SRS[c.id]);
}

/* ---- BADGES ---- */
const BADGE_DEFS = [
  {id:"first_card",    emoji:"🃏", label:"Erste Karte",       desc:"Review your first card",         check:(st,se)=>Object.values(st.perDay||{}).reduce((a,b)=>a+b,0)>=1},
  {id:"cards_100",     emoji:"📚", label:"Hundert Karten",    desc:"Review 100 cards total",         check:(st,se)=>Object.values(st.perDay||{}).reduce((a,b)=>a+b,0)>=100},
  {id:"cards_500",     emoji:"📚", label:"Fünfhundert",       desc:"Review 500 cards total",         check:(st,se)=>Object.values(st.perDay||{}).reduce((a,b)=>a+b,0)>=500},
  {id:"cards_1000",    emoji:"📚", label:"Tausend Karten",    desc:"Review 1,000 cards total",       check:(st,se)=>Object.values(st.perDay||{}).reduce((a,b)=>a+b,0)>=1000},
  {id:"cards_5000",    emoji:"📚", label:"Fünftausend",       desc:"Review 5,000 cards total",       check:(st,se)=>Object.values(st.perDay||{}).reduce((a,b)=>a+b,0)>=5000},
  {id:"streak_3",      emoji:"✦",  label:"Drei Tage",         desc:"3-day streak",                   check:(st)=>(st.streak||0)>=3},
  {id:"streak_7",      emoji:"🔥", label:"Eine Woche",        desc:"7-day streak",                   check:(st)=>(st.streak||0)>=7},
  {id:"streak_30",     emoji:"🔥", label:"Ein Monat",         desc:"30-day streak",                  check:(st)=>(st.streak||0)>=30},
  {id:"streak_100",    emoji:"🔥", label:"Hundert Tage",      desc:"100-day streak",                 check:(st)=>(st.streak||0)>=100},
  {id:"comeback",      emoji:"🦅", label:"Rückkehr",          desc:"Return after a 7+ day gap",      check:(st,se)=>!!(se&&se._cameBackAfterGap)},
  {id:"mod_1",         emoji:"🗺️", label:"Überlebenskünstler",desc:"Learn all Module I cards",       check:()=>_modComplete(1)},
  {id:"mod_2",         emoji:"☕", label:"Alltagskenner",     desc:"Learn all Module II cards",      check:()=>_modComplete(2)},
  {id:"mod_3",         emoji:"🏠", label:"Daheim",            desc:"Learn all Module III cards",     check:()=>_modComplete(3)},
  {id:"mod_4",         emoji:"🏙️", label:"Stadtkenner",       desc:"Learn all Module IV cards",      check:()=>_modComplete(4)},
  {id:"mod_5",         emoji:"💼", label:"Berufsmensch",      desc:"Learn all Module V cards",       check:()=>_modComplete(5)},
  {id:"mod_6",         emoji:"💚", label:"Wohlbefinden",      desc:"Learn all Module VI cards",      check:()=>_modComplete(6)},
  {id:"mod_7",         emoji:"🌿", label:"Naturmensch",       desc:"Learn all Module VII cards",     check:()=>_modComplete(7)},
  {id:"mod_8",         emoji:"🗳️", label:"Weltbürger",        desc:"Learn all Module VIII cards",    check:()=>_modComplete(8)},

  {id:"early_bird",    emoji:"🌅", label:"Frühaufsteher",     desc:"Study before 8am",               check:(st,se)=>!!(se&&se._studyHour<8)},
  {id:"night_owl",     emoji:"🌙", label:"Nachteule",         desc:"Study after 10pm",               check:(st,se)=>!!(se&&se._studyHour>=22)},
  {id:"new_year",      emoji:"🎊", label:"Neujahrs-Lernen",   desc:"Study on January 1st",           check:(st,se)=>!!(se&&se._studyDate&&se._studyDate.slice(5)==="01-01")},
];
function hasBadge(id) { return (STATS.badges||[]).some(b=>b.id===id); }
function checkBadges(sess) {
  const alreadyUnlocked = new Set((STATS.badges||[]).map(b=>b.id));
  const newly = [];
  for (const def of BADGE_DEFS) {
    if (alreadyUnlocked.has(def.id)) continue;
    try { if (def.check(STATS, sess)) { STATS.badges.push({id:def.id, unlockedAt:isoToday()}); newly.push(def.id); } }
    catch(e) {}
  }
  if (newly.length) saveStats(STATS);
  return newly;
}

/* ---- SM-2 ---- */
function isoToday(offset = 0) {
  const d = new Date(); d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}
function defaultState() { return { ef:2.5, interval:0, reps:0, due:null, lapses:0 }; }
function applySM2(state, q) {
  state = { ...state };
  if (q < 3) { state.reps = 0; state.interval = 1; state.lapses = (state.lapses||0) + 1; }
  else {
    state.reps = (state.reps||0) + 1;
    let baseInterval;
    if      (state.reps === 1) baseInterval = 1;
    else if (state.reps === 2) baseInterval = 6;
    else                       baseInterval = state.interval * state.ef;

    let difficultyMult = 1;
    if (state.reps <= 2) {
      if (q === 3) difficultyMult = 0.5;
      else if (q === 4) difficultyMult = 1;
      else if (q === 5) difficultyMult = 2;
    }
    state.interval = Math.round(baseInterval * difficultyMult);
  }
  let ef = state.ef + 0.1 - (5-q)*(0.08 + (5-q)*0.02);
  state.ef = parseFloat(Math.max(1.3, ef).toFixed(3));
  state.due = isoToday(state.interval);
  state.lastReview = isoToday();
  state.lastRating = q;
  return state;
}
function intervalLabel(state, q) {
  const d = applySM2(state || defaultState(), q).interval;
  if (d === 1) return "1 day";
  if (d < 30)  return d + " days";
  if (d < 365) return Math.round(d/30) + " mo";
  return (d/365).toFixed(1) + " yr";
}

/* ---- PERSISTENCE ---- */
function loadSRS()    { try { return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}; } catch { return {}; } }
function saveSRS(s)   { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {} }
function loadConfig() { const d={newPerDay:10,dailyGoal:10,reviewLimit:120,frontMode:"de",lastModule:1}; try { return {...d,...JSON.parse(localStorage.getItem(CONFIG_KEY))}; } catch { return d; } }
function saveConfig(c){ try { localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); } catch {} }
function loadStats()  { const d={lastStudyDate:null,streak:0,perDay:{},xp:0,badges:[],graceBank:3,graceBankLastRegen:null,goalBonusDate:null,goodSessionCount:0,goalStreakMax:0}; try { return {...d,...JSON.parse(localStorage.getItem(STATS_KEY))}; } catch { return d; } }
function saveStats(s) { try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch {} }

/* ---- QUERY HELPERS ---- */
function moduleCards(m) { return CARDS.filter(c => c.module === m); }
function newCardsFor(m) { return moduleCards(m).filter(c => !SRS[c.id]); }
function dueCardsFor(m) {
  const today = isoToday();
  return moduleCards(m).filter(c => { const s=SRS[c.id]; return s && s.due && s.due <= today; });
}
function learnedCount(m) { return moduleCards(m).filter(c => !!SRS[c.id]).length; }
function totalDue()      { const t=isoToday(); return Object.values(SRS).filter(s=>s.due&&s.due<=t).length; }
function totalLearned()  { return Object.keys(SRS).length; }
function todayCount()    { return STATS.perDay[isoToday()] || 0; }

function buildQueue(m) {
  const due = [...dueCardsFor(m)]; shuffle(due);
  return [...due.slice(0, CONFIG.reviewLimit), ...newCardsFor(m).sort((a,b)=>a.id-b.id).slice(0, CONFIG.newPerDay)];
}

/* ---- STATS ---- */
function recordCard() {
  const today = isoToday(), yesterday = isoToday(-1);
  const prevCount = STATS.perDay[today] || 0;
  STATS.perDay[today] = prevCount + 1;

  if (STATS.lastStudyDate !== today) {
    // Weekly grace bank regen (1 per week, max 3)
    if (STATS.graceBank < 3) {
      const weekAgo = isoToday(-7);
      const lastRegen = STATS.graceBankLastRegen;
      if (!lastRegen || lastRegen <= weekAgo) {
        STATS.graceBank = Math.min(3, (STATS.graceBank || 0) + 1);
        STATS.graceBankLastRegen = today;
      }
    }

    // Streak logic with grace bank
    if (!STATS.lastStudyDate || STATS.lastStudyDate === yesterday) {
      STATS.streak = (STATS.streak || 0) + 1;
    } else {
      const gapDays = Math.round((new Date(today) - new Date(STATS.lastStudyDate)) / 86400000);
      if (gapDays >= 7 && session) session._cameBackAfterGap = true;
      if ((STATS.graceBank || 0) > 0 && gapDays === 2) {
        STATS.graceBank--;
        STATS.streak = (STATS.streak || 0) + 1;
      } else {
        STATS.streak = 1;
      }
    }
    STATS.lastStudyDate = today;
  }

  // Daily goal bonus XP: +20 XP once per day on first card that hits the goal
  // Stored as pending so rateCurrent() can combine it into one toast
  if (STATS.goalBonusDate !== today && prevCount < CONFIG.dailyGoal && STATS.perDay[today] >= CONFIG.dailyGoal) {
    STATS.goalBonusDate = today;
    STATS._pendingGoalBonus = (STATS._pendingGoalBonus || 0) + 20;
  }

  saveStats(STATS);
}

/* ---- ENCOURAGEMENT ---- */
function motiveLine() {
  const done=todayCount(), goal=CONFIG.dailyGoal, streak=STATS.streak||0;
  if (done === 0) {
    return ["A blank page awaits. Open a module and begin.", "The first card of the day is always the hardest.", "Every session starts with a single card."][new Date().getDate()%3];
  }
  if (done < goal) return `<strong>${done} card${done!==1?"s":""}</strong> today — ${goal-done} more to reach your daily goal.`;
  if (done === goal) return `<strong>Goal reached!</strong> ${goal} cards today. The streak continues.`;
  if (streak >= 30) return `<strong>${done} cards</strong> today. Thirty days without missing a beat — remarkable.`;
  if (streak >= 7)  return `<strong>${done} cards</strong> today. A full week of consistency.`;
  return `<strong>${done} cards</strong> today — well past your goal. Excellent session.`;
}
function sessionCelebration(ratings) {
  if (!ratings.length) return "Nothing was due. Come back tomorrow.";
  const good=ratings.filter(q=>q>=4).length, pct=Math.round(good/ratings.length*100);
  const done=todayCount(), goal=CONFIG.dailyGoal;
  if (pct===100) return "A perfect session — every card answered well.";
  if (pct>=80)   return `Strong work. ${pct}% of cards answered correctly.`;
  if (done>=goal) return `Daily goal reached. ${ratings.length} cards reviewed.`;
  return `${ratings.length} cards reviewed. Every repetition builds the foundation.`;
}

/* ---- COMPONENTS ---- */
function buildRing() {
  const done=todayCount(), goal=CONFIG.dailyGoal, pct=Math.min(1,done/goal);
  const r=20, circ=2*Math.PI*r, offset=circ*(1-pct);
  const wrap=el("div",{class:"ring-mini"});
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("width","52"); svg.setAttribute("height","52"); svg.setAttribute("viewBox","0 0 52 52"); svg.classList.add("ring-svg");
  const track=document.createElementNS("http://www.w3.org/2000/svg","circle");
  track.setAttribute("cx","26"); track.setAttribute("cy","26"); track.setAttribute("r",String(r)); track.classList.add("ring-track");
  const fill=document.createElementNS("http://www.w3.org/2000/svg","circle");
  fill.setAttribute("cx","26"); fill.setAttribute("cy","26"); fill.setAttribute("r",String(r));
  fill.classList.add("ring-fill"); if(pct>=1) fill.classList.add("complete");
  fill.style.strokeDasharray=circ; fill.style.strokeDashoffset=offset;
  svg.appendChild(track); svg.appendChild(fill); wrap.appendChild(svg);
  const center=el("div",{class:"ring-center"});
  center.appendChild(el("div",{class:"ring-count"},String(done)));
  center.appendChild(el("div",{class:"ring-slash"},"/"+goal));
  wrap.appendChild(center);
  return wrap;
}

function buildHeatmap() {
  const wrap=el("div",{class:"heatmap-grid"}), today=isoToday();
  for (let i=41; i>=0; i--) {
    const d=new Date(); d.setDate(d.getDate()-i);
    const iso=d.toISOString().slice(0,10);
    const count=STATS.perDay[iso]||0;
    const level=count===0?0:count<5?1:count<10?2:count<20?3:4;
    const cell=el("div",{class:"heat-cell"+(iso===today?" today":"")});
    cell.dataset.level=level;
    cell.title=(iso===today?"Today":iso)+": "+count+" card"+(count!==1?"s":"");
    wrap.appendChild(cell);
  }
  return wrap;
}

function renderDone() {
  document.body.classList.remove("in-study"); $bar.classList.remove("visible");

  // Run badge checks once per session
  if (session && !session._badgesChecked) {
    session._badgesChecked = true;
    if (session.ratings.length > 0) {
      const good=session.ratings.filter(q=>q>=4).length;
      if (good/session.ratings.length >= 0.8) STATS.goodSessionCount=(STATS.goodSessionCount||0)+1;
      const gs=goalStreak();
      if (gs > (STATS.goalStreakMax||0)) STATS.goalStreakMax=gs;
      saveStats(STATS);
    }
    session._newBadges = checkBadges(session);
  }

  const wrap=el("section",{class:"empty-state"});
  wrap.appendChild(el("div",{class:"empty-ornament"},"✦"));
  wrap.appendChild(el("h2",{},"Session complete."));

  if (session&&session.ratings.length>0) {
    const counts={again:0,hard:0,good:0,easy:0};

    const summary=el("div",{class:"session-summary"});
    for (const [lbl,val,cls] of [["Cards reviewed",session.ratings.length,""],["Again",counts.again,counts.again>0?"again":""],["Hard",counts.hard,""],["Good",counts.good,counts.good>session.ratings.length/2?"good":""],["Easy",counts.easy,""]]) {

    }

      const row=el("div",{class:"badge-unlock-row"});

  wrap.appendChild(el("p",{},remaining>0?`${remaining} more cards available in this module.`:"This module is clear. Try another or come back tomorrow."));

  if (remaining>0) actions.appendChild(el("button",{class:"btn",onclick:()=>startStudy(view.module)},"Continue"));
  actions.appendChild(el("button",{class:"btn secondary",onclick:exitStudy},"Library"));
  wrap.appendChild(actions); $app.appendChild(wrap);
}

function startStudy(m) {

function exitStudy() {
  document.body.classList.remove("in-study"); $bar.classList.remove("visible");

function flipCard(flashEl) {
  session.flipped=true;
  if (flashEl) flashEl.classList.add("flipped");
  updateRatingBar(session.queue[session.idx]);
}
function updateRatingBar(card) {
  const state=SRS[card.id]||defaultState(), qs=[1,3,4,5];
  for (let i=0;i<4;i++) {
    document.getElementById("rBtn"+(i+1)).disabled=!session.flipped;
  }
}
function rateCurrent(q) {
  if (!session||!session.flipped) return;
  const card=session.queue[session.idx];
  const prevState=SRS[card.id]||defaultState();
  if (q===5 && (prevState.lapses||0)>=3) session._rescuedCard=true;
  SRS[card.id]=applySM2(prevState,q); saveSRS(SRS);
  session.ratings.push(q); session.flipped=false; recordCard();
  const xpMap={1:0,3:1,4:3,5:5};
  const totalXP=(xpMap[q]||0)+(STATS._pendingGoalBonus||0);
  delete STATS._pendingGoalBonus;
  awardXP(totalXP);
  if (q<3) { const t=Math.min(session.queue.length,session.idx+1+5+Math.floor(Math.random()*4)); session.queue.splice(t,0,card); }
  session.idx++; renderMeta(); render();
}

/* ---- SETTINGS ---- */
function openSettings() {
  document.getElementById("newPerDay").value=CONFIG.newPerDay;
  document.getElementById("dailyGoal").value=CONFIG.dailyGoal;
  document.getElementById("reviewLimit").value=CONFIG.reviewLimit;
  document.getElementById("frontMode").value=CONFIG.frontMode;
  document.getElementById("settingsModal").classList.add("open");
}
function closeSettings() { document.getElementById("settingsModal").classList.remove("open"); }
document.getElementById("settingsClose").addEventListener("click",closeSettings);
document.getElementById("settingsModal").addEventListener("click",e=>{if(e.target.id==="settingsModal")closeSettings();});
document.getElementById("settingsSave").addEventListener("click",()=>{
  CONFIG.newPerDay=Math.max(1,Math.min(50,parseInt(document.getElementById("newPerDay").value)||10));
  CONFIG.dailyGoal=Math.max(5,Math.min(200,parseInt(document.getElementById("dailyGoal").value)||10));
  CONFIG.reviewLimit=Math.max(10,Math.min(500,parseInt(document.getElementById("reviewLimit").value)||120));
  CONFIG.frontMode=document.getElementById("frontMode").value;
  saveConfig(CONFIG); closeSettings(); showToast("Saved."); render();
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(!confirm("Erase all progress? This cannot be undone."))return;
  SRS={}; STATS={lastStudyDate:null,streak:0,perDay:{},xp:0,badges:[],graceBank:3,graceBankLastRegen:null,goalBonusDate:null,goodSessionCount:0,goalStreakMax:0}; saveSRS(SRS); saveStats(STATS);
  closeSettings(); showToast("Progress reset."); render();
});

/* ---- KEYBOARD ---- */
document.addEventListener("keydown",e=>{
  if(document.getElementById("settingsModal").classList.contains("open")){if(e.key==="Escape")closeSettings();return;}
  if(view.name!=="study")return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();if(!session.flipped)flipCard(document.querySelector(".flashcard"));return;}
  if(session.flipped){if(e.key==="1")rateCurrent(1);else if(e.key==="2")rateCurrent(3);else if(e.key==="3")rateCurrent(4);else if(e.key==="4")rateCurrent(5);}
  if(e.key==="Escape")exitStudy();
});

/* ---- UTILITIES ---- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function el(tag,attrs={},...children){
  const e=document.createElement(tag);
  for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k.startsWith("on")&&typeof attrs[k]==="function")e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);else e.setAttribute(k,attrs[k]);}
  for(const c of children){if(c==null)continue;if(typeof c==="string")e.appendChild(document.createTextNode(c));else if(c instanceof Node)e.appendChild(c);}
  return e;
}
function styledTerm(card){
  if(card.type==="noun"&&card.noun){const f=document.createDocumentFragment();f.appendChild(el("span",{class:"article"},card.noun.gender+" "));f.appendChild(document.createTextNode(card.term.replace(/^(der|die|das)\s+/,"")));return f;}
  return document.createTextNode(card.term);
}
function typeLabel(c){return{noun:"noun · Substantiv",verb:"verb · Verb",adj:"adjective · Adjektiv",adv:"adverb · Adverb",phrase:"phrase · Wendung"}[c.type]||"term · Wort";}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(showToast._t);showToast._t=setTimeout(()=>t.classList.remove("show"),1900);}

render();
</script>
